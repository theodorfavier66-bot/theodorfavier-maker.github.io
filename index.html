<script>
(() => {
  // ✅ CONFIG
  const PHONE = "+33782795833";
  const EMAIL = "theodor.favier@icloud.com";
  const URL = "https://serrutech.github.io";

  // ✅ Helpers
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const $  = (sel, root = document) => root.querySelector(sel);

  // ✅ Force background not to block clicks (iOS safety)
  const bg = $(".bg-image");
  if (bg) bg.style.pointerEvents = "none";

  // ✅ Tabs: show panel + set active button
  function openTab(id) {
    $$(".info-box").forEach(b => b.classList.remove("active"));
    const panel = document.getElementById(id);
    if (panel) panel.classList.add("active");

    // highlight the clicked nav button (yellow)
    $$(".nav-links .btn").forEach(b => b.classList.remove("active"));
    const btn = $(`.nav-links .btn[data-tab="${id}"]`);
    if (btn) btn.classList.add("active");
  }

  // ✅ Make call
  function makeCall() {
    openTab("call");
    // iOS: use direct navigation
    window.location.href = `tel:${PHONE}`;
  }

  // ✅ Download vCard (VCF)
  function downloadVCard() {
    const vcf = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      "N:SERRUTECH;;;;",
      "FN:SERRUTECH 66",
      "ORG:SERRUTECH",
      `TEL;TYPE=CELL:${PHONE}`,
      `EMAIL:${EMAIL}`,
      `URL:${URL}`,
      "END:VCARD"
    ].join("\n");

    const blob = new Blob([vcf], { type: "text/vcard;charset=utf-8" });
    const fileUrl = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = fileUrl;
    a.download = "SERRUTECH-66.vcf";
    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(() => URL.revokeObjectURL(fileUrl), 1000);
  }

  // ✅ Visual feedback: make button yellow on click (works for <div>, <a>, <button>)
  function flashActive(el) {
    if (!el) return;
    el.classList.add("active");
    // remove after short delay so it doesn't stay yellow forever unless it's the selected tab
    setTimeout(() => {
      // if it's the selected tab button, keep it
      const tab = el.getAttribute("data-tab");
      if (!tab) el.classList.remove("active");
    }, 250);
  }

  // ✅ Bind NAV buttons (TOP 4)
  // IMPORTANT: add data-action or data-tab on your buttons
  // - Appeler: data-action="call"
  // - Vcard: data-tab="vcard"
  // - Site: data-tab="site"
  // Instagram is a real <a href> => no need

  $$(".nav-links .btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      // if it's a real link (instagram), let it work
      const isLink = btn.tagName.toLowerCase() === "a" && btn.getAttribute("href");
      if (!isLink) e.preventDefault();

      flashActive(btn);

      const action = btn.getAttribute("data-action");
      const tab = btn.getAttribute("data-tab");

      if (action === "call") return makeCall();
      if (tab) return openTab(tab);
    }, { passive: false });
  });

  // ✅ Bind CTA buttons inside panels
  // If your CTA are <div class="cta-main">, we bind by data-action.
  $$(".cta-main, .cta").forEach(cta => {
    cta.addEventListener("click", (e) => {
      const action = cta.getAttribute("data-action");
      if (!action) return;

      e.preventDefault();
      flashActive(cta);

      if (action === "call") return makeCall();
      if (action === "vcard") return downloadVCard();
      if (action === "site")  return (window.location.href = URL);
    }, { passive: false });
  });

  // ✅ Fallback: if old onclick still exists, expose functions (so it doesn't break)
  window.openTab = openTab;
  window.makeCall = makeCall;
  window.downloadVCard = downloadVCard;

  // ✅ Default view
  openTab("call");
})();
</script>
