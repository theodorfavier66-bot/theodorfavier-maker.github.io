<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SERRUTECH | 66</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --accent-yellow:#ffde59;
      --bg:#0f0f0f;
      --glass:rgba(255,255,255,0.06);
      --border:rgba(255,255,255,0.14);
      --text:#ffffff;
      --muted:rgba(255,255,255,0.75);
    }

    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    body{
      font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      min-height:100vh;
      background:var(--bg);
      color:var(--text);
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
      overflow-x:hidden;
    }

    .bg-image{
      position:fixed;
      inset:0;
      background:
        linear-gradient(rgba(0,0,0,0.72), rgba(0,0,0,0.72)),
        url('fond.png') no-repeat center center;
      background-size:cover;
      opacity:0.55;
      z-index:-1;
    }

    .container{
      width:100%;
      max-width:1000px;
      background:rgba(15,15,15,0.92);
      border:1px solid var(--border);
      border-radius:14px;
      padding:50px;
      display:flex;
      gap:50px;
      box-shadow:0 40px 80px rgba(0,0,0,0.9);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
    }

    .left-panel{flex:1;display:flex;flex-direction:column;justify-content:center;}
    .logo-main{
      width:220px;
      filter:brightness(0) invert(1);
      margin-bottom:15px;
    }
    .tagline{
      font-family:'Orbitron',sans-serif;
      font-size:11px;
      letter-spacing:4px;
      text-transform:uppercase;
      color:var(--accent-yellow);
      opacity:0.75;
      margin-bottom:40px;
      font-weight:700;
    }

    .nav-links{display:flex;flex-direction:column;gap:12px;}

    .btn{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:16px 20px;
      background:var(--glass);
      border:1px solid var(--border);
      border-radius:4px;
      color:var(--text);
      text-decoration:none;
      font-size:13px;
      font-weight:600;
      text-transform:uppercase;
      letter-spacing:1px;
      cursor:pointer;
      transition:transform .15s ease, background .2s ease, border-color .2s ease;
      user-select:none;
